name: Check v82 Import Review Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check v82 import cleanup remains active
        shell: bash
        run: |
          set -euo pipefail
          node --check import-review-cleanup-v82.js
          grep -Fq "import-review-cleanup-v82.js?v=82" sync-state-sanitizer-v22.js
          grep -Fq "import-review-cleanup-v82.js?v=82" sw.js
      - name: Check confirmation-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "reviewQueue" import-review-cleanup-v82.js
          grep -Fq "dismissReview" import-review-cleanup-v82.js
          ! grep -Fq "semanticReviewRowsV48" import-review-cleanup-v82.js
          ! grep -Fq "data-v48-review-save" import-review-cleanup-v82.js
      - name: Check retired repayment visualization stays retired
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "injectClassic('./liquidity-flow-v82.js?v=82'" sync-state-sanitizer-v22.js
          ! grep -Fq '"./liquidity-flow-v82.js?v=82"' sw.js
