name: Check v94 Core Card Authority

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check v94 syntax and authoritative loaders
        shell: bash
        run: |
          set -euo pipefail
          for f in planning-model-v79.js planning-model-v80.js card-cycle-v81.js card-event-consistency-v86.js card-cashflow-edit-v75.js card-import-corrections-v73.js card-baseline-floor-v94.js sync-state-sanitizer-v22.js; do node --check "$f"; done
          grep -Fq "window.__householdRuntimeRelease = 'v94'" sync-state-sanitizer-v22.js
          grep -Fq "card-baseline-floor-v94.js?v=94" sync-state-sanitizer-v22.js
          grep -Fq 'household-treasury-v94-card-baseline-floor' sw.js
          grep -Fq './sync-state-sanitizer-v22.js?v=94' sw.js
          grep -Fq './card-baseline-floor-v94.js?v=94' sw.js
          grep -Fq './sync-state-sanitizer-v22.js?v=94' index.html
          ! grep -Fq 'card-forecast-authority-v92.js?v=93' sync-state-sanitizer-v22.js
          ! grep -Fq 'card-forecast-authority-v92.js?v=93' sw.js
          grep -Fq "updateViaCache:'none'" index.html
      - name: Check v94 floor policy is final
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Math.max(base,existing,components)" card-baseline-floor-v94.js
          grep -Fq "MANUAL_OVERRIDE" card-baseline-floor-v94.js
          grep -Fq "meaningfulActual" card-baseline-floor-v94.js
          grep -Fq "BASELINE_FLOOR_V94" card-baseline-floor-v94.js
          grep -Fq "householdPlanningV79" card-baseline-floor-v94.js
          grep -Fq "householdCardForecastV49" card-baseline-floor-v94.js
          grep -Fq "generatedBaselineFloorV94" card-baseline-floor-v94.js
      - name: Check detail ownership and recent imports
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'cardBillingLines' card-import-corrections-v73.js
          grep -Fq 'v75PurchaseDetails' card-cashflow-edit-v75.js
          ! grep -Fq 'MutationObserver' card-import-corrections-v73.js
          ! grep -Fq 'setInterval' card-import-corrections-v73.js
          ! grep -Fq 'MutationObserver' card-cashflow-edit-v75.js
          ! grep -Fq 'setInterval' card-cashflow-edit-v75.js
