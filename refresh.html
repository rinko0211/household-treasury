<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household Treasury 更新</title>
<style>body{margin:0;background:#0b1020;color:#eef4ff;font:16px system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:28px}.muted{color:#9fb0cc}</style>
</head>
<body><div class="box"><h2>Household Treasury を更新しています</h2><p class="muted" id="status">古いPWAキャッシュを削除しています…</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('household-treasury-')).map(k=>caches.delete(k)));
    }
    document.getElementById('status').textContent='更新完了。最新版を開きます…';
    location.replace('./?fresh=20260903-v5');
  }catch(e){
    document.getElementById('status').textContent='自動更新に失敗しました。ブラウザを閉じて開き直してください。';
  }
})();
</script></body></html>
