
name: Check v112 Unified Transactions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v112:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cash-expense-analytics-v106.js
          node --check semantic-ui-v48.js
          node --check semantic-model-v47.js
          grep -Fq "semantic-model-v47.js?v=109" sync-state-sanitizer-v22.js
          grep -Fq "semantic-model-v47.js?v=109" sw.js
          grep -Fq "GIFTS_EVENTS" semantic-model-v47.js
          grep -Fq "cash-expense-analytics-v106.js?v=110" sync-state-sanitizer-v22.js
          grep -Fq "semantic-ui-v48.js?v=110" sync-state-sanitizer-v22.js
          grep -Fq "semantic-ui-v48.js?v=110" sw.js
          grep -Fq "data-v110-tx-detail" semantic-ui-v48.js
          grep -Fq "transactionDetailV110" semantic-ui-v48.js
          grep -Fq "cash_expense" semantic-ui-v48.js
          ! grep -Fq "Import Summary" app.js
          grep -Fq "openSemanticTransactionEditorV108" semantic-ui-v48.js
          grep -Fq "manual_transaction_override_v108" semantic-ui-v48.js
          grep -Fq "card-import-corrections-v73.js?v=112" sync-state-sanitizer-v22.js
          grep -Fq "card-import-corrections-v73.js?v=112" sw.js
          grep -Fq "householdCardImportCorrectionsV91" card-import-corrections-v73.js
          grep -Fq "reconcileRakutenBillingV56" rakuten-billing-v56.js
          grep -Fq "cash-expense-analytics-v106.js?v=110" sw.js
          grep -Fq 'data-page="transactions"' index.html
          ! grep -Fq "cashExpenseCsvHelpV106" cash-expense-analytics-v106.js
          ! grep -Fq "link-audit-v33.js" sync-state-sanitizer-v22.js
          ! grep -Fq "link-audit-v33.js" sw.js
          grep -Fq "dashboard-v39.js?v=107" sync-state-sanitizer-v22.js
          grep -Fq "planning-ui-v79.js?v=107" sync-state-sanitizer-v22.js
          grep -Fq "planning-ui-v79.js?v=107" sw.js
          grep -Fq "householdExpenseAnalyticsV106" planning-ui-v79.js
          grep -Fq "householdExpenseAnalyticsV106" dashboard-v39.js
          grep -Fq "cashExpenses" app.js
          grep -Fq "app.js?v=112" index.html
          grep -Fq "sync-state-sanitizer-v22.js?v=112" index.html
          grep -Fq "household-treasury-v112-ui-consolidation" sw.js
          grep -Fq "__householdRuntimeRelease = 'v112'" sync-state-sanitizer-v22.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser test cash CSV and category drilldown
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/v106-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:4173/?v106e2e=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__householdRuntimeRelease==='v112'&&!!window.householdExpenseAnalyticsV106&&!!window.openSemanticTransactionEditorV108&&!!window.householdCardImportCorrectionsV91&&!!window.reconcileRakutenBillingV56,{timeout:15000});
            await page.evaluate(()=>{
              const st=structuredClone((window.getTreasuryStateRaw||window.getTreasuryState)());
              st.cashExpenses=[];
              st.imports=[];
              st.settings={...(st.settings||{}),cash:123456,reserve:100000,salary:500000,salaryDay:18,reservedSpecial:1234};
              st.assets={...(st.assets||{}),bank:123456};
              st.purchaseEvents=[
                {purchase_id:'card-food',purchase_date:'2026-09-20',merchant_raw:'カードスーパー',original_amount:3000,card:'Rakuten',economic_type:'EXPENSE',spending_class:'NORMAL',category:'FOOD'}
              ];
              st.cashTransactions=[
                {id:'atm',date:'2026-09-21',amount:-10000,description_raw:'カード出金',cashflow_type:'CASH_WITHDRAWAL_UNCLASSIFIED',economic_type:'EXPENSE',spending_class:'NORMAL',category:'OTHER'},
                {id:'settle',date:'2026-09-22',amount:-50000,description_raw:'楽天カード',source:'楽天銀行',cashflow_type:'CARD_SETTLEMENT',economic_type:'TRANSFER',spending_class:null,category:null},
                {id:'clinic',date:'2026-09-23',amount:-1070,description_raw:'クリニック',cashflow_type:'UNKNOWN',economic_type:'EXPENSE',spending_class:'NORMAL',category:'MEDICAL'},
                {id:'funding',date:'2026-09-24',amount:-20000,description_raw:'カード振込用資金移動',cashflow_type:'UNKNOWN',economic_type:'EXPENSE',spending_class:'NORMAL',category:'OTHER'}
              ];
              st.cardSettlements=[{settlement_id:'s1',card:'Rakuten',due_date:'2026-09-22',amount:50000,bank_transaction_id:'settle',source_file:'rakuten-test.csv'}];
              st.cardBillingLines=[
                {billing_line_id:'bill1',card:'Rakuten',billing_month:'2026-09',purchase_date:'2026-09-05',merchant_raw:'請求内訳',original_amount:50000,billed_amount:50000,occurrence_index:1,source_file:'rakuten-test.csv'},
                {billing_line_id:'old-bill',card:'Rakuten',billing_month:'2026-09',purchase_date:'2026-09-01',merchant_raw:'旧請求明細',original_amount:7777,billed_amount:7777,occurrence_index:1,source_file:'rakuten-old.csv'}
              ];
              window.replaceTreasuryState(st);
              const cur=(window.getTreasuryStateRaw||window.getTreasuryState)();
              window.reconcileRakutenBillingV56(cur);
              const rs=(cur.cardSettlements||[]).find(x=>x.settlement_id==='s1');
              if(Number(rs?.detail_payment_total)!==50000||Number(rs?.detail_difference)!==0||Number(rs?.detail_count)!==1)throw new Error('stale statement lines contaminated current reconciliation: '+JSON.stringify(rs));
              window.replaceTreasuryState(cur);
            });
            await page.click('[data-page="imports"]');
            await page.waitForTimeout(100);
            if(await page.locator('#imports #semanticTransactionsV48').count())throw new Error('transaction history leaked into Import tab');
            if(await page.locator('#cardImportCorrectionsV73,#cashExpenseCsvHelpV106,#autoLinkAuditV33,#importSummary').count())throw new Error('retired Import UI remains');
            const csv='日付,内容,金額,カテゴリー,区分,メモ\n2026-09-24,現金スーパー,3888,食費,通常費,\n2026-09-25,現金旅行用品,6000,旅行,特別費,\n';
            await page.setInputFiles('#csvInput',{name:'cash-expenses-test.csv',mimeType:'text/csv',buffer:Buffer.from(csv,'utf8')});
            await page.waitForFunction(()=>((window.getTreasuryStateRaw||window.getTreasuryState)().cashExpenses||[]).length===2,{timeout:10000});
            const model=await page.evaluate(()=>window.householdExpenseAnalyticsV106.summarize((window.getTreasuryStateRaw||window.getTreasuryState)(),'2026-09'));
            if(model.totals.NORMAL!==27958)throw new Error('NORMAL total '+model.totals.NORMAL+' expected 27958 before reclassification');
            if(model.totals.SPECIAL!==6000)throw new Error('SPECIAL total '+model.totals.SPECIAL+' expected 6000');
            if(model.rows.some(r=>r.name==='カード出金'||r.name==='楽天カード'))throw new Error('ATM/card settlement leaked into spending rows');
            await page.click('[data-page="dashboard"]');
            const spend=page.locator('#dashSpendV79');
            await spend.waitFor({state:'visible',timeout:10000});
            await spend.locator('[data-expense-scope-toggle="1"][data-expense-scope="NORMAL"]').waitFor({state:'visible',timeout:10000});
            const txt=await spend.innerText();
            if(!txt.includes('通常費')||!txt.includes('特別費'))throw new Error('visible scope grouping missing: '+txt);
            const normalList=spend.locator('[data-expense-category-list="NORMAL"]');
            const specialList=spend.locator('[data-expense-category-list="SPECIAL"]');
            if(await normalList.isVisible()||await specialList.isVisible())throw new Error('visible category lists must be collapsed initially');
            const detailModal=page.locator('#expenseDetailModalV106');
            if(await detailModal.isVisible())throw new Error('raw detail opened before category tap');
            await spend.locator('[data-expense-scope-toggle="1"][data-expense-scope="NORMAL"]').click();
            await normalList.waitFor({state:'visible'});
            await spend.locator('[data-expense-detail="1"][data-expense-scope="NORMAL"][data-expense-category="FOOD"]').waitFor({state:'visible'});
            if(await specialList.isVisible())throw new Error('SPECIAL categories leaked into NORMAL drilldown');
            await spend.locator('[data-expense-detail="1"][data-expense-scope="NORMAL"][data-expense-category="FOOD"]').click();
            await page.waitForSelector('#expenseDetailModalV106',{state:'visible'});
            const detail=await page.locator('#expenseDetailRowsV106').innerText();
            if(!detail.includes('カードスーパー')||!detail.includes('現金スーパー'))throw new Error('food detail missing rows: '+detail);
            if(detail.includes('カード出金')||detail.includes('楽天カード'))throw new Error('excluded rows appeared in detail');
            await page.locator('[data-expense-close="1"]').click();

            // Historical bank transaction can be edited later from the raw dashboard detail.
            if(!(await normalList.isVisible()))await spend.locator('[data-expense-scope-toggle="1"][data-expense-scope="NORMAL"]').click();
            await spend.locator('[data-expense-detail="1"][data-expense-scope="NORMAL"][data-expense-category="OTHER"]').waitFor({state:'visible'});
            await spend.locator('[data-expense-detail="1"][data-expense-scope="NORMAL"][data-expense-category="OTHER"]').click();
            await page.waitForSelector('#expenseDetailModalV106',{state:'visible'});
            await page.locator('[data-expense-edit="1"][data-expense-edit-kind="cash"][data-expense-edit-id="funding"]').click();
            await page.waitForSelector('#transactionEditorV108',{state:'visible'});
            await page.selectOption('#transactionEditorEconV108','TRANSFER');
            await page.locator('[data-v108-tx-save]').click();
            await page.waitForFunction(()=>{const t=((window.getTreasuryStateRaw||window.getTreasuryState)().cashTransactions||[]).find(x=>x.id==='funding');return t?.economic_type==='TRANSFER'&&t?.is_transfer===true},{timeout:10000});

            const after=await page.evaluate(()=>window.householdExpenseAnalyticsV106.summarize((window.getTreasuryStateRaw||window.getTreasuryState)(),'2026-09'));
            if(after.totals.NORMAL!==7958)throw new Error('NORMAL total '+after.totals.NORMAL+' expected 7958 after transfer reclassification');
            if(after.rows.some(r=>r.name==='カード振込用資金移動'))throw new Error('reclassified transfer still appears as spending');

            // Import is intake-only; transaction history is a separate tab.
            await page.click('[data-page="imports"]');
            if(await page.locator('#imports #semanticTransactionsV48').count())throw new Error('transaction history leaked into Import tab');
            await page.click('[data-page="transactions"]');
            const fundingRow=page.locator('#semanticTransactionRowsV48 [data-v110-tx-detail][data-v110-kind="cash"][data-v110-id="funding"]');
            await fundingRow.waitFor({state:'visible',timeout:10000});
            await fundingRow.click();
            await page.waitForSelector('#transactionDetailV110',{state:'visible'});
            const fundingDetail=await page.locator('#transactionDetailBodyV110').innerText();
            if(!fundingDetail.includes('資金移動'))throw new Error('reclassified bank transfer detail missing');
            await page.locator('[data-v110-detail-close]').click();

            // Cash CSV row is editable from the unified detail view.
            const cashId=await page.evaluate(()=>((window.getTreasuryStateRaw||window.getTreasuryState)().cashExpenses||[]).find(x=>x.description==='現金スーパー')?.id);
            if(!cashId)throw new Error('cash expense id missing');
            const cashRow=page.locator('#semanticTransactionRowsV48 [data-v110-tx-detail][data-v110-kind="cash_expense"][data-v110-id="'+cashId+'"]');
            await cashRow.waitFor({state:'visible',timeout:10000});
            await cashRow.click();
            await page.locator('[data-v110-sem-edit][data-v110-kind="cash_expense"]').click();
            await page.waitForSelector('#transactionEditorV108',{state:'visible'});
            await page.fill('#transactionRawAmountV110','4000');
            await page.locator('[data-v108-tx-save]').click();
            await page.waitForFunction(()=>((window.getTreasuryStateRaw||window.getTreasuryState)().cashExpenses||[]).some(x=>x.description==='現金スーパー'&&Number(x.amount)===4000),{timeout:10000});
            const afterCashEdit=await page.evaluate(()=>window.householdExpenseAnalyticsV106.summarize((window.getTreasuryStateRaw||window.getTreasuryState)(),'2026-09'));
            if(afterCashEdit.totals.NORMAL!==8070)throw new Error('cash edit did not update NORMAL total: '+afterCashEdit.totals.NORMAL);

            // Card v91 correction is now reached from the unified transaction detail.
            const tx=page.locator('#semanticTransactionRowsV48');
            await tx.locator('[data-v110-tx-detail][data-v110-kind="purchase"][data-v110-id="card-food"]').click();
            await page.waitForSelector('#transactionDetailV110',{state:'visible'});
            await page.locator('#transactionDetailV110 [data-v110-card-edit][data-v110-kind="purchase"]').click();
            await page.waitForSelector('#cardImportEditModalV73',{state:'visible'});
            await page.locator('#cardImportEditModalV73 [data-v73-close]').first().click();

            if(await tx.locator('[data-v110-tx-detail][data-v110-kind="cash"][data-v110-id="settle"]').count())throw new Error('linked card settlement duplicated bank row');
            if(await tx.locator('[data-v110-tx-detail][data-v110-kind="settlement"][data-v110-id="s1"]').count()!==1)throw new Error('linked card settlement missing');

            // A card billing-line edit must recompute statement difference immediately.
            await tx.locator('[data-v110-tx-detail][data-v110-kind="billing"][data-v110-id="bill1"]').click();
            await page.waitForSelector('#transactionDetailV110',{state:'visible'});
            await page.locator('#transactionDetailV110 [data-v110-card-edit][data-v110-kind="billing"]').click();
            await page.waitForSelector('#cardImportEditModalV73',{state:'visible'});
            await page.fill('#v73LineBilled','49000');
            await page.locator('#cardImportEditModalV73 [data-v73-save]').click();
            await page.waitForFunction(()=>{const x=((window.getTreasuryStateRaw||window.getTreasuryState)().cardSettlements||[]).find(s=>s.settlement_id==='s1');return Number(x?.detail_difference)===1000&&x?.detail_reconciled===false},{timeout:10000});
            await tx.locator('[data-v110-tx-detail][data-v110-kind="billing"][data-v110-id="bill1"]').click();
            await page.locator('#transactionDetailV110 [data-v110-card-edit][data-v110-kind="billing"]').click();
            await page.fill('#v73LineBilled','50000');
            await page.locator('#cardImportEditModalV73 [data-v73-save]').click();
            await page.waitForFunction(()=>{const x=((window.getTreasuryStateRaw||window.getTreasuryState)().cardSettlements||[]).find(s=>s.settlement_id==='s1');return Number(x?.detail_difference)===0&&x?.detail_reconciled===true},{timeout:10000});

            await page.click('[data-page="settings"]');
            if(await page.locator('#cash,#salaryDay,#reservedSpecial,#masterImportBtnV1,#masterExportBtnV1').count())throw new Error('retired settings/master JSON controls remain');
            if(!(await page.locator('#reserve').isVisible())||!(await page.locator('#salary').isVisible()))throw new Error('required basic settings missing');
            if(!(await page.locator('#exportJson').isVisible())||!(await page.locator('#importJson').isVisible()))throw new Error('unified backup controls missing');
            await page.fill('#reserve','150000');
            await page.fill('#salary','520000');
            await page.click('#saveSettings');
            await page.waitForFunction(()=>{const st=(window.getTreasuryStateRaw||window.getTreasuryState)();return Number(st.settings?.reserve)===150000&&Number(st.settings?.salary)===520000},{timeout:10000});
            const settingsState=await page.evaluate(()=>{const st=(window.getTreasuryStateRaw||window.getTreasuryState)();return{cash:st.settings?.cash,salaryDay:st.settings?.salaryDay,reservedSpecial:st.settings?.reservedSpecial,bank:st.assets?.bank}});
            if(Number(settingsState.cash)!==123456||Number(settingsState.bank)!==123456)throw new Error('saving basic settings changed current cash: '+JSON.stringify(settingsState));
            if(Number(settingsState.salaryDay)!==18||Number(settingsState.reservedSpecial)!==1234)throw new Error('saving basic settings changed hidden settings: '+JSON.stringify(settingsState));

            await page.click('[data-page="dashboard"]');
            await spend.locator('[data-expense-scope-toggle="1"][data-expense-scope="SPECIAL"]').click();
            await spend.locator('[data-expense-detail="1"][data-expense-scope="SPECIAL"][data-expense-category="TRAVEL"]').waitFor({state:'visible'});

            // Household CSV labels are normalized into analytically useful categories.
            await page.click('[data-page="imports"]');
            const householdCsv='日付,内容,金額,カテゴリー,区分\n'+
              '2026-09-27,妻の服,1000,衣服・美容,通常費\n'+
              '2026-09-27,サンドラッグ ネイル,500,衣服・美容,通常費\n'+
              '2026-09-27,航空祭おみやげ,2000,イベント・贈答,特別費\n'+
              '2026-09-27,お風呂チケット,1000,レジャー,通常費\n'+
              '2026-09-27,好文堂 児童書,1000,子ども・教育,通常費\n'+
              '2026-09-27,ガソリン,1000,ガソリン,通常費\n'+
              '2026-09-27,外食,1000,外食,通常費\n';
            await page.setInputFiles('#csvInput',{name:'household-category-test.csv',mimeType:'text/csv',buffer:Buffer.from(householdCsv,'utf8')});
            await page.waitForFunction(()=>((window.getTreasuryStateRaw||window.getTreasuryState)().cashExpenses||[]).length===9,{timeout:10000});
            const cats=await page.evaluate(()=>{
              const rows=(window.getTreasuryStateRaw||window.getTreasuryState)().cashExpenses||[];
              return Object.fromEntries(rows.filter(x=>['妻の服','サンドラッグ ネイル','航空祭おみやげ','お風呂チケット','好文堂 児童書','ガソリン','外食'].includes(x.description)).map(x=>[x.description,[x.category,x.subcategory,x.spending_class]]));
            });
            const expect={
              '妻の服':['DAILY_GOODS','CLOTHING','NORMAL'],
              'サンドラッグ ネイル':['PERSONAL','BEAUTY','NORMAL'],
              '航空祭おみやげ':['GIFTS_EVENTS','GIFT','SPECIAL'],
              'お風呂チケット':['ENTERTAINMENT','HOBBY','NORMAL'],
              '好文堂 児童書':['EDUCATION','BOOKS','NORMAL'],
              'ガソリン':['CAR','FUEL','NORMAL'],
              '外食':['FOOD','EATING_OUT','NORMAL']
            };
            for(const [name,want] of Object.entries(expect)){
              const got=cats[name];
              if(!got||got.join('|')!==want.join('|'))throw new Error(name+' mapped '+JSON.stringify(got)+' expected '+JSON.stringify(want));
            }
            console.log('V110_OK',JSON.stringify({normalBefore:model.totals.NORMAL,normalAfterTransfer:after.totals.NORMAL,normalAfterCashEdit:afterCashEdit.totals.NORMAL,special:after.totals.SPECIAL,categories:cats}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
