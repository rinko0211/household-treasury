name: Deploy Household Treasury

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            case "$(basename "$f")" in
              sync-v24.js|sync-v26.js)
                cp "$f" "/tmp/$(basename "$f" .js).mjs"
                node --check "/tmp/$(basename "$f" .js).mjs"
                ;;
              *) node --check "$f";;
            esac
          done
      - name: Run current unified expense, verified correction, and treasury regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/treasury-ledger-v145.test.js
          node tests/expense-unified-v148.test.js
          node tests/release-assets-contract-v194.test.cjs
          node tests/workflow-scope-v194.test.cjs
          node tests/personal-ledger-v186.test.cjs
          node tests/settings-mobile-layout-v171.test.cjs
          node tests/continuous-transaction-editor-v167.test.cjs
          node tests/transaction-card-master-v176.test.cjs
          node tests/card-billing-month-auto-v177.test.cjs
          node tests/cash-to-card-master-v178.test.cjs
          node tests/card-to-cash-master-v179.test.cjs
          node tests/cash-edit-persistence-v181.test.cjs
          node tests/cash-merge-stable-v184.test.cjs
          node tests/observer-proxy-no-recursion-v185.test.cjs
          node tests/family-published-stamp-v183.test.cjs
          node tests/header-actions-v180.test.cjs
          node tests/ci-current-assets-v180.cjs settings-ux-v45.js family-share-owner-v160.js
          node tests/expense-nature-rules-v152.test.js
          node tests/verified-correction-v149.test.js
          node tests/cycle-audit-reconciliation-v153.test.js
          node tests/purchase-usage-v157.test.js
          node tests/bank-history-index-v196.test.cjs
          node tests/payment-reclass-v159.test.js
          node tests/family-share-v160.test.js
          node tests/family-share-v163.test.js
          node tests/family-viewer-v163.test.js
          node tests/family-budget-clarity-v173.test.cjs
          node tests/family-budget-pace-v174.test.cjs
          node tests/family-sync-v164.test.js
          node tests/unified-repair-v161.test.js
          node tests/mdc-cross-source-v166.test.cjs
          node tests/mdc-pdf-csv-preflight-v188.test.cjs
          node tests/mdc-pdf-bulk-review-v189.test.cjs
          node tests/mdc-pdf-post-import-v190.test.cjs
          node tests/manual-expense-delete-v192.test.cjs
          node tests/mdc-pdf-import.test.cjs
          node tests/structured-payment-and-pdf-v168.test.cjs
      - name: Check release links against actual app version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const loader=fs.readFileSync('sync-state-sanitizer-v22.js','utf8');
          // Derive current versions from HTML/loader instead of pinning numbers.
          function sourceAsset(filename,source){
            const escaped=filename.replaceAll('.','\\.');
            const url=source.match(new RegExp('\\./'+escaped+'\\?v=\\d+'))?.[0];
            assert.ok(url,'Runtime source missing: '+filename);
            assert.ok(sw.includes('"'+url+'"'),'PWA cache missing: '+url);
            return url;
          }
          const appAsset=sourceAsset('app.js',html);
          const expenseAsset=sourceAsset('expense-unified-v148.js',html);
          const personalAsset=sourceAsset('personal-ledger-v186.js',html);
          const loaderAsset=sourceAsset('sync-state-sanitizer-v22.js',html);
          const familyAsset=sourceAsset('family-share-owner-v160.js',html);
          const editorAsset=sourceAsset('semantic-ui-v48.js',loader);
          const cashCardAsset=sourceAsset('cash-card-reclass-v178.js',loader);
          const cardCashAsset=sourceAsset('card-cash-reclass-v179.js',loader);
          const hub=fs.readFileSync('expense-unified-v148.js','utf8');
          assert.ok(fs.readFileSync('manual-expense-delete-v192.js','utf8').includes('manually_deleted_v192'));
          const purchaseUsage=fs.readFileSync('purchase-usage-ledger-v157.js','utf8');
          const expenseNature=fs.readFileSync('expense-nature-rules-v152.js','utf8');
          const correction=fs.readFileSync('verified-correction-patch-v149.js','utf8');
          const audit=fs.readFileSync('cycle-audit-reconciliation-v153.js','utf8');
          for(const [file,label] of [
            ['index.html','HTML'],['sw.js','service worker'],
            ['treasury-ledger-v145.js','treasury engine'],
            ['expense-unified-v148.js','unified expense UI'],
            ['personal-ledger-v186.js','private personal ledger'],
            ['purchase-usage-ledger-v157.js','purchase-date usage ledger'],
            ['expense-nature-rules-v152.js','exact user-approved subcategory rules'],
            ['expense-unified-v148.css','unified mobile styling'],
            ['verified-correction-patch-v149.js','verified correction importer'],
            ['mdc-pdf-delta-v144.js','PDF import dedup'],
            ['cycle-audit-reconciliation-v153.js','data-driven cycle audit and safe patch']
          ])assert.ok(fs.existsSync(file),label+' missing');
          assert.ok(!html.includes('id="monthlyTreasuryTabV142"'),'redundant monthly tab survives');
          assert.ok(html.includes('data-page="expenses"'));
          assert.ok(!html.includes('monthly-treasury-v142.js?v=146'));
          assert.ok(html.includes('expense-nature-rules-v152.js?v=159'));
          assert.ok(html.includes('purchase-usage-ledger-v157.js?v=196'));
          assert.ok(html.includes('manual-expense-delete-v192.js?v=192'));
          assert.ok(html.includes(personalAsset));
          assert.ok(html.includes(expenseAsset));
          assert.ok(html.indexOf('expense-nature-rules-v152.js?v=159') < html.indexOf('purchase-usage-ledger-v157.js?v=196'));
          assert.ok(html.indexOf('purchase-usage-ledger-v157.js?v=196') < html.indexOf(expenseAsset));
          assert.ok(html.includes('expense-unified-v148.css?v=192'));
          assert.ok(html.includes('ui-modern-v169.css?v=180'));
          assert.ok(!html.includes('card-budget-allocation-v170.js'),'Removed recommendation panel must not be mounted');
          assert.ok(sw.includes('./ui-modern-v169.css?v=180'));
          assert.ok(html.includes(loaderAsset));
          assert.ok(sw.includes('./fixed-master-unified-v43.js?v=171'));
          assert.ok(sw.includes('./card-settings-unified-v77.js?v=171'));
          assert.ok(loader.includes('fixed-master-unified-v43.js?v=171'));
          assert.ok(loader.includes('card-settings-unified-v77.js?v=171'));

          assert.ok(!sw.includes('card-budget-allocation-v170.js'),'Removed recommendation panel must not be cached');
          assert.ok(!html.includes('expenseTabRootV129'));
          assert.ok(!require('node:fs').existsSync('expense-tab-v130.js'),'retired expense UI should be deleted');
          assert.ok(!require('node:fs').existsSync('card-baseline-review-v169.js'),'stale history-based card suggestions must be removed');
          assert.ok(!fs.existsSync('card-budget-allocation-v170.js'),'Retired recommendation panel script should be deleted');

          assert.ok(hub.includes('この明細を確認・編集'));
          assert.ok(hub.includes('チャージ・資金移動の疑い'));
          assert.ok(loader.includes(editorAsset));
          assert.ok(fs.readFileSync('semantic-ui-v48.js','utf8').includes('transactionEditorTopupV165'));
          assert.ok(fs.readFileSync('semantic-ui-v48.js','utf8').includes('data-v108-tx-next'));
          assert.ok(hub.includes('captureEditContext')&&hub.includes('restoreEditContext'));
          assert.ok(hub.includes("reviewOpen?' open':''"));

          assert.ok(fs.readFileSync('family/family.js','utf8').includes('管理アプリの「支出」'));

          assert.ok(html.includes(loaderAsset));
          assert.ok(html.includes('treasury-ledger-v145.js?v=153'));
          assert.ok(/const CACHE="household-treasury-v\d+-[^"]+"/.test(sw));
          assert.ok(sw.includes(editorAsset));
          assert.ok(sw.includes(appAsset));
          assert.ok(html.includes(appAsset));
          assert.ok(fs.readFileSync('semantic-ui-v48.js','utf8').includes('直前の保存を処理中です'));
          assert.ok(fs.readFileSync('app.js','utf8').includes('state=previous'));
          assert.ok(fs.readFileSync('semantic-ui-v48.js','utf8').includes('assertCashExpenseSaved'));
          assert.ok(loader.includes('semantic-observer-guard-v71.js?v=185'));
          assert.ok(sw.includes('./semantic-observer-guard-v71.js?v=185'));
          assert.ok(fs.readFileSync('app.js','utf8').includes('cash-expense-id:'));
          assert.ok(fs.readFileSync('family/index.html','utf8').includes('publishedTimeV183'));
          assert.ok(fs.readFileSync('family/family.js','utf8').includes('published_at'));
          assert.ok(loader.includes(cashCardAsset));
          assert.ok(sw.includes(cashCardAsset));
          assert.ok(loader.includes(cardCashAsset));
          assert.ok(sw.includes(cardCashAsset));
          assert.ok(sw.includes('./card-cycle-v81.js?v=179'));
          assert.ok(sw.includes('./card-forecast-v49.js?v=179'));
          assert.ok(sw.includes('./cash-expense-analytics-v106.js?v=178'));
          assert.ok(html.includes('cycle-audit-reconciliation-v153.js?v=161'));
          assert.ok(html.includes('payment-reclass-patch-v159.js?v=161'));
          assert.ok(html.includes(familyAsset));
          assert.ok(sw.includes(familyAsset));
          assert.ok(sw.includes('./settings-ux-v45.js?v=180'));
          assert.ok(sw.includes('./ui-modern-v169.css?v=180'));
          assert.ok(fs.readFileSync('settings-ux-v45.js','utf8').includes('treasuryHeaderActionsV180'));
          assert.ok(fs.readFileSync('family-share-owner-v160.js','utf8').includes('movePublishToHeader'));
          assert.ok(sw.includes('./family/index.html'));
          assert.ok(sw.includes('./family/family.js?v=183'));
          assert.ok(sw.includes('./family/family.css?v=183'));
          assert.ok(fs.readFileSync('family/index.html','utf8').includes('family.js?v=183'));
          assert.ok(fs.readFileSync('family/index.html','utf8').includes('family.css?v=183'));
          assert.ok(fs.readFileSync('family/index.html','utf8').includes('id="legacyHint"'));
          assert.ok(fs.readFileSync('family-share-owner-v160.js','utf8').includes('schema_version:2'));
          assert.ok(fs.readFileSync('supabase/functions/family-variable-share/index.ts','utf8').includes("input?.snapshot?.schema_version!==2"));
          assert.ok(fs.readFileSync('family/family.js','utf8').includes('data.snapshot')||fs.readFileSync('family/family.js','utf8').includes('d.snapshot'));

          assert.ok(html.includes('sync-v26.js?v=160'));
          assert.ok(sw.includes('./sync-v26.js?v=160'));
          assert.ok(fs.existsSync('family/index.html'));
          assert.ok(fs.existsSync('family/family.js'));
          assert.ok(fs.existsSync('family/family.css'));
          assert.ok(fs.existsSync('supabase/functions/family-variable-share/index.ts'));

          assert.ok(sw.includes('./payment-reclass-patch-v159.js?v=161'));
          assert.ok(html.includes('repair-import-unified-v161.js?v=161'));
          assert.ok(sw.includes('./repair-import-unified-v161.js?v=161'));
          assert.ok(!loader.includes("injectClassic('./expense-tab-v130.js"), 'old expense renderer was not retired');
          assert.ok(!sw.includes('./expense-tab-v130.js?v=130'), 'old expense renderer remains precached');
          assert.ok(loader.includes('cash-expense-analytics-v106.js?v=178'));
          assert.ok(loader.includes(editorAsset));
          assert.ok(!html.includes('<script src="'+editorAsset+'"'), 'duplicate legacy editor loader');
          assert.ok(audit.includes('planPatch')&&audit.includes('reallocateResidual'));
          assert.ok(audit.includes('元明細の項目が第三の値に変更されています'));
          assert.ok(audit.includes('guardIsOld'));
          assert.ok(audit.includes('verifySameBankSettlement'));
          assert.ok(loader.includes('card-cycle-v81.js?v=179'));
          assert.ok(html.includes('verified-correction-patch-v149.js?v=161'));
          assert.ok(correction.includes('treasuryRecoverySnapshot')&&correction.includes('replaceTreasuryState'));
          for(const path of [
            loaderAsset.slice(2),
            'expense-nature-rules-v152.js?v=159',
            'purchase-usage-ledger-v157.js?v=196',
            personalAsset.slice(2),
            'manual-expense-delete-v192.js?v=192',
            expenseAsset.slice(2),
            'expense-unified-v148.css?v=192',
            'verified-correction-patch-v149.js?v=161',
            'cycle-audit-reconciliation-v153.js?v=161',
            'card-cycle-v81.js?v=179',
            'treasury-ledger-v145.js?v=153',
            'mdc-pdf-delta-v144.js?v=192'
          ])assert.ok(sw.includes('./'+path),'PWA cache missing '+path);
          assert.ok(sw.includes('./mdc-cross-source-reconcile-v166.js?v=192'));
          assert.ok(loader.includes('mdc-cross-source-reconcile-v166.js?v=192'));
          assert.ok(loader.includes('mdc-pdf-import-v136.js?v=192'));
          assert.ok(loader.includes('structured-expense-import-v168.js?v=192'));
          assert.ok(sw.includes('./structured-expense-import-v168.js?v=192'));
          assert.ok(fs.readFileSync('mdc-pdf-delta-v144.js','utf8').includes('receiptAbsorbed'));
          assert.ok(fs.readFileSync('structured-expense-import-v168.js','utf8').includes('payment_method'));

          assert.ok(!fs.readFileSync('mdc-pdf-delta-v144.js','utf8').includes('mdcRegisteredExcludeV190'));
          assert.ok(fs.readFileSync('mdc-pdf-import-v136.js','utf8').includes('scanPdfPreview'));
          assert.ok(!loader.includes('mdc-pdf-record-manager-v146.js'),'retired old PDF UI is still injected');
          assert.ok(!sw.includes('mdc-pdf-record-manager-v146.js'),'retired old PDF UI is still precached');
          assert.ok(hub.includes('data-hub-cycle')&&hub.includes('data-hub-lens')&&hub.includes('data-hub-bucket'));
          assert.ok(hub.includes('data-hub-category')&&hub.includes('data-hub-subcategory')&&hub.includes('openSemanticTransactionEditorV108'));
          assert.ok(hub.includes('年間の収支を見る'));
          assert.ok(hub.includes('固定支払マスターの月額内訳（ローン含む・参考）'));
          assert.ok(expenseNature.includes('HOME_MAINTENANCE=SPECIAL'));
          assert.ok(expenseNature.includes('INTEREST=VARIABLE'));
          assert.ok(expenseNature.includes('PRADO_SUMMER'));
          assert.ok(!hub.includes('cardUnallocated'),'legacy card settlements cannot appear as expense category');
          assert.ok(purchaseUsage.includes('fullAmount')&&purchaseUsage.includes('auditCycle'));
          assert.ok(purchaseUsage.includes('bankFlow')&&purchaseUsage.includes('reviewCount'));
          assert.ok(purchaseUsage.includes('normalFixed')&&purchaseUsage.includes('normalVariable')&&purchaseUsage.includes('normalUndetermined'));
          assert.ok(hub.includes('固定費・ローン')&&hub.includes('ローン・借入返済（消費外）')&&hub.includes("label:'変動費'")&&hub.includes("label:'個人費'")&&hub.includes('通常費（固定・変動未確定）'));
          assert.ok(!hub.includes("{id:'debt',label:"),'Loan bucket must only appear inside fixed commitments');
          assert.ok(hub.includes("lens='economic'"));
          assert.ok(hub.includes('通常の消費・生活費'));
          assert.ok(hub.includes('支出・資金用途合計'));
          assert.ok(hub.includes('口座資金流出（引落日ベース）'));
          assert.ok(!hub.includes('カード引落（用途未配分）'));
          assert.ok(hub.includes('要確認：'));
          assert.ok(hub.includes('毎月の基本予算（参考）'));
          console.log('RELEASE_V171_SETTINGS_RESPONSIVE_NO_RECOMMENDATIONS_PASS');
          NODE
      - name: Bundle PDF.js parser for same-origin iPhone import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pdfjs
          fetch_pdfjs() {
            local file="$1"
            for base in \
              "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38" \
              "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build" \
              "https://unpkg.com/pdfjs-dist@4.10.38/build"; do
              if curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 \
                   "${base}/${file}" -o "vendor/pdfjs/${file}"; then
                if [ "$file" = "pdf.min.mjs" ] && [ "$(wc -c < vendor/pdfjs/$file)" -gt 100000 ]; then return 0; fi
                if [ "$file" = "pdf.worker.min.mjs" ] && [ "$(wc -c < vendor/pdfjs/$file)" -gt 500000 ]; then return 0; fi
              fi
            done
            echo "PDF.js runtime download failed: $file" >&2
            exit 1
          }
          fetch_pdfjs pdf.min.mjs
          fetch_pdfjs pdf.worker.min.mjs
          node --check vendor/pdfjs/pdf.min.mjs
          node --check vendor/pdfjs/pdf.worker.min.mjs
          mkdir -p vendor/pdfjs/cmaps
          for cmap in Adobe-Japan1-UCS2 Adobe-Japan1-0 Adobe-Japan1-1 Adobe-Japan1-2 Adobe-Japan1-3 Adobe-Japan1-4 Adobe-Japan1-5 Adobe-Japan1-6 UniJIS-UCS2-H UniJIS-UTF16-H 90ms-RKSJ-H; do
            success=0
            for base in \
              "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps" \
              "https://unpkg.com/pdfjs-dist@4.10.38/cmaps"; do
              if curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 \
                   "${base}/${cmap}.bcmap" -o "vendor/pdfjs/cmaps/${cmap}.bcmap"; then
                if [ "$(wc -c < "vendor/pdfjs/cmaps/${cmap}.bcmap")" -gt 20 ]; then success=1; break; fi
              fi
            done
            if [ "$success" -ne 1 ]; then echo "Missing Japanese PDF CMap: $cmap" >&2; exit 1; fi
          done
          printf '%s\n' 'PDF.js 4.10.38, Apache License 2.0, https://github.com/mozilla/pdf.js' > vendor/pdfjs/NOTICE.txt
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.mjs" \
            -o vendor/pdfjs/pdf.legacy.mjs
          node tests/mdc-pdf-japanese-cmap.integration.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
