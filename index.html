<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Household Treasury</title><meta name="theme-color" content="#0b1020"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg"><style>
:root{--bg:#0b1020;--p:#141d32;--p2:#192640;--line:#2b3b5d;--text:#eef4ff;--muted:#9fb0cc;--good:#6ee7b7;--warn:#fbbf24;--bad:#fb7185;--accent:#7dd3fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#09101e,#0c1425);color:var(--text);font:14px system-ui,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:20px}.top,.tabs,.controls,.row{display:flex;gap:10px;align-items:center}.top{justify-content:space-between;align-items:flex-start}.top h1{margin:0;font-size:24px}.muted,.tiny{color:var(--muted)}.tiny{font-size:11px}.pill,.tag{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}.tabs{margin:18px 0;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#15223b;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:#28436c}.btn.secondary{background:#0f182b;color:var(--muted)}.btn.danger{background:#3a1c28;color:#fecdd3}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:15px}.kpi{grid-column:span 3}.half{grid-column:span 6}.full{grid-column:1/-1}.kpi b{display:block;font-size:25px;margin-top:7px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.title{font-weight:700;margin-bottom:12px}.row{justify-content:space-between;padding:9px 0;border-bottom:1px solid #263755}.row:last-child{border:0}.amt{font-weight:700;font-variant-numeric:tabular-nums}.field{display:flex;flex-direction:column;gap:5px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select{background:#0d1729;color:white;border:1px solid var(--line);border-radius:9px;padding:9px;min-width:0}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:9px;border-bottom:1px solid #243551;text-align:right;font-size:12px}th:first-child,td:first-child{text-align:left}.drop{border:1px dashed #55709d;border-radius:14px;padding:28px;text-align:center;cursor:pointer}.note{padding:11px;border-left:3px solid var(--accent);background:#10203a;border-radius:8px;line-height:1.6}.hidden{display:none!important}@media(max-width:760px){.kpi,.half{grid-column:1/-1}.form{grid-template-columns:1fr 1fr}.app{padding:12px}.top{flex-direction:column}}@media(max-width:480px){.form{grid-template-columns:1fr}}
</style></head><body><main class="app"><div class="top"><div><h1>Household Treasury</h1><div class="muted">純資産 × 資金繰り × 投資余力</div></div><div class="pill" id="saveStatus">ローカル保存</div></div>
<nav class="tabs"><button class="tab active" data-page="dashboard">Dashboard</button><button class="tab" data-page="cashflow">Cash Flow</button><button class="tab" data-page="wealth">Wealth</button><button class="tab" data-page="imports">Import</button><button class="tab" data-page="settings">Settings</button></nav>
<section id="dashboard" class="page active"><div class="grid"><div class="card kpi"><span class="muted">純金融資産</span><b id="kpiNet">—</b></div><div class="card kpi"><span class="muted">流動資金</span><b id="kpiCash">—</b></div><div class="card kpi"><span class="muted">90日最低残高</span><b id="kpiLow">—</b><div class="tiny" id="kpiLowDate"></div></div><div class="card kpi"><span class="muted">追加投資可能額</span><b id="kpiInvest">—</b></div><div class="card half"><div class="title">直近イベント</div><div id="nextEvents"></div></div><div class="card half"><div class="title">安全余力</div><div class="note" id="safety"></div></div><div class="card full"><div class="title">資産構成</div><div id="assets"></div></div></div></section>
<section id="cashflow" class="page"><div class="grid"><div class="card full"><div class="title">将来イベント</div><div class="controls" style="margin-bottom:10px"><button class="btn" id="addEvent">＋臨時イベント</button><button class="btn secondary" id="addRule">＋固定費ルール</button></div><div class="table"><table><thead><tr><th>日付</th><th>内容</th><th>区分</th><th>金額</th><th>イベント後残高</th><th></th></tr></thead><tbody id="eventsBody"></tbody></table></div></div></div></section>
<section id="wealth" class="page"><div class="card"><div class="title">月次資産履歴</div><div class="table"><table><thead><tr><th>月</th><th>預金</th><th>投資等</th><th>負債</th><th>純金融資産</th></tr></thead><tbody id="wealthBody"></tbody></table></div><div class="controls" style="margin-top:10px"><button class="btn" id="snapshot">今月スナップショット</button></div></div></section>
<section id="imports" class="page"><div class="grid"><div class="card full"><div class="title">CSV / TSV Import Inbox</div><div class="drop" id="drop">銀行・カードCSVをここにドロップ、またはクリック<input class="hidden" id="csvInput" type="file" multiple accept=".csv,.tsv,.txt"></div><div id="importResults"></div></div><div class="card half"><div class="title">バックアップ</div><div class="controls"><button class="btn" id="exportJson">JSON書出し</button><button class="btn secondary" id="importJson">JSON読込</button><input class="hidden" id="jsonInput" type="file" accept="application/json"></div><div class="tiny" style="margin-top:10px">PRIVATE IMPORT JSONもここから読み込めます。</div></div></div></section>
<section id="settings" class="page"><div class="grid"><div class="card full"><div class="title">基本設定</div><div class="form"><div class="field"><label>現在の流動資金</label><input id="cash" type="number"></div><div class="field"><label>安全資金</label><input id="reserve" type="number"></div><div class="field"><label>給与（月額）</label><input id="salary" type="number"></div><div class="field"><label>給与日</label><input id="salaryDay" type="number" min="1" max="31"></div></div><div class="controls" style="margin-top:12px"><button class="btn" id="saveSettings">保存</button></div></div><div class="card full"><div class="title">固定費ルール</div><div id="rules"></div></div><div class="card full"><div class="title">端末間同期 <span class="tag" id="cloudStatusTag">未サインイン</span></div><div class="form"><div class="field"><label>同期メール</label><input id="cloudEmail" type="email"></div><div class="field"><label>ログイン用パスワード</label><input id="cloudPassword" type="password"></div><div class="field"><label>暗号化パスフレーズ</label><input id="vaultPassphrase" type="password"></div><div class="field"><label>サインイン中</label><input id="cloudUser" readonly></div></div><div class="controls" style="margin-top:12px"><button class="btn" id="cloudSignUpBtn">初回アカウント作成</button><button class="btn" id="cloudSignInBtn">サインイン</button><button class="btn secondary hidden" id="cloudSignOutBtn">サインアウト</button><button class="btn" id="pushCloudBtn" disabled>この端末のデータを送信</button><button class="btn secondary" id="pullCloudBtn" disabled>クラウドから取得</button></div><div class="tiny" id="cloudDetail" style="margin-top:10px">Supabaseへ送る前に端末内で暗号化します。</div></div></div></section></main><script src="./app.js"></script><script type="module" src="./sync.js"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
