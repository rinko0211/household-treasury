name: Browser Check v100 Asset History Chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check v100 model and loader
        shell: bash
        run: |
          set -euo pipefail
          node --check asset-chart-v100.js
          grep -Fq "asset-chart-v100.js?v=100" sync-state-sanitizer-v22.js
          grep -Fq "asset-chart-v100.js?v=100" sw.js
          grep -Fq "household-treasury-v100-asset-history-chart" sw.js
          node <<'NODE'
          const {buildModel}=require('./asset-chart-v100.js');
          const st={assetSnapshots:[
            {snapshot_date:'2026-09-11',market_value:3946526,invested_market_value:3718906,cash_balance:227620},
            {snapshot_date:'2026-09-18',market_value:4100000,invested_market_value:3850000,cash_balance:250000},
            {snapshot_date:'2026-09-18',market_value:4200000,invested_market_value:3920000,cash_balance:280000}
          ]};
          const m=buildModel(st);
          if(m.points.length!==2)throw new Error('same-day snapshots were not deduplicated');
          if(m.latest.total!==4200000)throw new Error('latest same-day snapshot did not win');
          if(m.totalChange!==253474)throw new Error('asset change calculation failed');
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Open deployed app and verify Wealth graph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            let release='';
            for(let i=0;i<40;i++){
              await page.goto(`https://rinko0211.github.io/household-treasury/?v100e2e=${Date.now()}-${i}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1200);
              release=await page.evaluate(()=>window.__householdRuntimeRelease||'').catch(()=> '');
              const ready=await page.evaluate(()=>!!window.householdAssetChartV100).catch(()=>false);
              if(release==='v100'&&ready)break;
              await page.waitForTimeout(3000);
            }
            if(release!=='v100')throw new Error(`deployed runtime is ${release||'unknown'}, expected v100`);
            await page.waitForFunction(()=>typeof window.replaceTreasuryState==='function'&&!!window.householdAssetChartV100,{timeout:15000});
            await page.evaluate(()=>{
              const st=structuredClone((window.getTreasuryStateRaw||window.getTreasuryState)());
              st.assetSnapshots=[
                {snapshot_date:'2026-09-11',institution:'Rakuten Securities',market_value:3946526,invested_market_value:3718906,cash_balance:227620,source_file:'assetbalance(all)_20260911_223508.csv',parser_version:85},
                {snapshot_date:'2026-09-18',institution:'Rakuten Securities',market_value:4200000,invested_market_value:3920000,cash_balance:280000,source_file:'assetbalance(all)_20260918_170000.csv',parser_version:85}
              ];
              window.replaceTreasuryState(st);
            });
            await page.click('[data-page="wealth"]');
            await page.waitForSelector('#assetHistoryChartV100',{state:'visible',timeout:10000});
            await page.waitForSelector('#assetChartPlotV100 svg',{state:'visible',timeout:10000});
            const title=await page.locator('#assetHistoryChartV100 .title').innerText();
            const summary=await page.locator('#assetChartSummaryV100').innerText();
            const coverage=await page.locator('#assetChartCoverageV100').innerText();
            if(!title.includes('v100'))throw new Error(`wrong chart title: ${title}`);
            if(!summary.replaceAll('￥','¥').includes('¥4,200,000'))throw new Error(`latest total missing: ${summary}`);
            if(!coverage.includes('2日分'))throw new Error(`snapshot count missing: ${coverage}`);
            await page.screenshot({path:'v100-asset-chart.png',fullPage:true});
            fs.writeFileSync('v100-asset-chart-result.json',JSON.stringify({release,title,summary,coverage},null,2));
            console.log('V100_ASSET_CHART_RESULT',JSON.stringify({release,title,summary,coverage}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v100-asset-chart-evidence
          path: |
            v100-asset-chart.png
            v100-asset-chart-result.json
          if-no-files-found: warn
