name: Check Import Isolation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check retired Import Summary and legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -f import-review-cleanup-v82.js
          test ! -f link-audit-v33.js
          ! grep -Fq "import-review-cleanup-v82.js" sync-state-sanitizer-v22.js
          ! grep -Fq "link-audit-v33.js" sync-state-sanitizer-v22.js
          ! grep -Fq "import-review-cleanup-v82.js" sw.js
          ! grep -Fq "link-audit-v33.js" sw.js
          ! grep -Fq "Import Summary" app.js
          grep -Fq 'data-page="transactions"' index.html
          grep -Fq 'data-page="imports"' index.html
