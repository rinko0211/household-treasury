name: Check v94 Card Baseline Floor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Syntax and runtime loading
        shell: bash
        run: |
          set -euo pipefail
          node --check card-baseline-floor-v94.js
          node --check sync-state-sanitizer-v22.js
          grep -Fq "window.__householdRuntimeRelease = 'v94'" sync-state-sanitizer-v22.js
          grep -Fq "sync-state-sanitizer-v22.js?v=94" index.html
          grep -Fq "card-baseline-floor-v94.js?v=94" sync-state-sanitizer-v22.js
          grep -Fq "card-baseline-floor-v94.js?v=94" sw.js
          grep -Fq 'household-treasury-v94-card-baseline-floor' sw.js
          ! grep -Fq "card-forecast-authority-v92.js?v=93" sync-state-sanitizer-v22.js
      - name: Verify baseline floor, high known amount, manual override and actual priority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const state={
            masters:{cards:[{id:'d1',name:'Dカード',active:true,paymentMode:'FULL',forecastMode:'BASELINE',monthlyBaselineAmount:50000}]},
            cardSettlements:[],cardCashflowOverrides:[]
          };
          const window={
            getTreasuryStateRaw:()=>state,getTreasuryState:()=>state,
            householdPlanningV79:{
              forecastMode:c=>c.forecastMode||'COMPONENTS',
              forecastAmountForCard:(c,n)=>Number(n)||0
            },
            renderMobileInteractionV70:()=>{},renderForecastV38:()=>{}
          };
          const baseRows=()=>[
            {id:'low',date:'2026-10-10',name:'Dカード 見込請求',amount:-18500,type:'CARD_ESTIMATE',source:'card_estimate_v81',card:'Dカード',billing_month:'2026-10',known_purchase_total:18500,scheduled_fixed_total:0},
            {id:'high',date:'2026-11-10',name:'Dカード 見込請求',amount:-50000,type:'CARD_ESTIMATE',source:'card_estimate_v81',card:'Dカード',billing_month:'2026-11',known_purchase_total:200000,scheduled_fixed_total:0}
          ];
          const sandbox={window,structuredClone,console,generated:()=>baseRows(),setTimeout:fn=>{fn();return 1;}};
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('card-baseline-floor-v94.js','utf8'),sandbox);
          let rows=sandbox.generated(120);
          let low=rows.find(r=>r.billing_month==='2026-10');
          let high=rows.find(r=>r.billing_month==='2026-11');
          if(low.amount!==-50000)throw new Error(`floor failed: ${low.amount}`);
          if(high.amount!==-200000)throw new Error(`high known amount failed: ${high.amount}`);
          if(window.householdPlanningV79.forecastAmountForCard(state.masters.cards[0],18500)!==50000)throw new Error('planning floor 18,500 -> 50,000 failed');
          if(window.householdPlanningV79.forecastAmountForCard(state.masters.cards[0],200000)!==200000)throw new Error('planning high 200,000 failed');

          state.cardCashflowOverrides=[{id:'ov1',key:'ESTIMATE|Dカード|2026-10',card:'Dカード',billing_month:'2026-10',amount:30000,date:'2026-10-10'}];
          rows=sandbox.generated(120);low=rows.find(r=>r.billing_month==='2026-10');
          if(low.amount!==-30000||low.forecast_method!=='MANUAL_OVERRIDE')throw new Error(`manual override priority failed: ${low.amount}`);

          state.cardCashflowOverrides=[];
          state.cardSettlements=[{settlement_id:'s1',card:'Dカード',due_date:'2026-10-10',amount:42000}];
          rows=sandbox.generated(120);
          if(rows.some(r=>r.type==='CARD_ESTIMATE'&&r.billing_month==='2026-10'))throw new Error('actual bill did not suppress estimate');
          NODE
      - name: No competing observer loop
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq "MutationObserver|setInterval" card-baseline-floor-v94.js; then exit 1; fi
