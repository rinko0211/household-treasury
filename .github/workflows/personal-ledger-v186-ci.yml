name: Private ledger v186 preflight
on:
  pull_request:
    paths:
      - 'personal-ledger-v186.js'
      - 'expense-unified-v148.js'
      - 'manual-expense-delete-v192.js'
      - 'private-ledger-repair-v199.js'
      - 'kabu-card-v44.js'
      - 'cross-source-audit-v201.js'
      - 'sync-state-sanitizer-v22.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/personal-ledger-v186-ci.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          node --check personal-ledger-v186.js
          node --check expense-unified-v148.js
          node --check manual-expense-delete-v192.js
          node --check private-ledger-repair-v199.js
          node --check kabu-card-v44.js
          node --check cross-source-audit-v201.js
          node tests/cross-source-audit-v201.test.cjs
          node tests/private-ledger-repair-v199.test.cjs
          node tests/kabu-card-v198.test.cjs
          node --check mdc-pdf-delta-v144.js
          node --check mdc-pdf-import-v136.js
          node tests/mdc-pdf-csv-preflight-v188.test.cjs
          node tests/mdc-pdf-bulk-review-v189.test.cjs
          node tests/mdc-pdf-post-import-v190.test.cjs
          node tests/manual-expense-delete-v192.test.cjs
          node tests/mdc-pdf-import.test.cjs
          node tests/structured-payment-and-pdf-v168.test.cjs
          node tests/personal-ledger-v186.test.cjs
          node tests/expense-unified-v148.test.js
          node tests/purchase-usage-v157.test.js
          node tests/bank-history-index-v196.test.cjs
          node tests/family-share-v160.test.js
          node tests/family-sync-v164.test.js
          node tests/ci-current-assets-v180.cjs personal-ledger-v186.js expense-unified-v148.js manual-expense-delete-v192.js mdc-pdf-delta-v144.js mdc-pdf-import-v136.js
