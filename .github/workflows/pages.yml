name: Deploy Household Treasury

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            case "$(basename "$f")" in
              sync-v24.js|sync-v26.js)
                cp "$f" "/tmp/$(basename "$f" .js).mjs"
                node --check "/tmp/$(basename "$f" .js).mjs"
                ;;
              *)
                node --check "$f"
                ;;
            esac
          done
      - name: Check critical runtime loaders
        shell: bash
        run: |
          set -euo pipefail
          grep -q "semantic-model-v47.js" sync-state-sanitizer-v22.js
          grep -q "occurrence-card-bridge-v65.js" sync-state-sanitizer-v22.js
          grep -q "mufg-import-integrity-v65.js" sync-state-sanitizer-v22.js
          grep -q "audit-hardening-v65.js" sync-state-sanitizer-v22.js
          grep -q "revolving-card-v66.js" sync-state-sanitizer-v22.js
          grep -q "bonus-modal-stability-v67.js" sync-state-sanitizer-v22.js
          grep -q "mobile-host-v70.js" sync-state-sanitizer-v22.js
          grep -q "mobile-interaction-kernel-v68.js" sync-state-sanitizer-v22.js
          grep -q "desktop-interaction-v69.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./expense-scope-v34.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./review-center-v40.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./annual-reserve-v36.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./interaction-stability-v62.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./master-occurrence-overrides-v63.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./card-detail-stability-v64.js" sync-state-sanitizer-v22.js
          ! grep -q "injectClassic('./mobile-cashflow-v60.js" sync-state-sanitizer-v22.js
          grep -q "masterOccurrenceOverrides" sync-v26.js
          grep -q "payment_model:'REVOLVING'" revolving-card-v66.js
          grep -q "CARD_REVOLVING_PAYMENT" revolving-card-v66.js
          grep -q "principal_unknown:true" revolving-card-v66.js
          grep -q "data-v68-event-del" mobile-interaction-kernel-v68.js
          grep -q "data-v68-occ-del" mobile-interaction-kernel-v68.js
          grep -q "data-v68-card-toggle" mobile-interaction-kernel-v68.js
          grep -q "data-v69-event-del" desktop-interaction-v69.js
          grep -q "data-v69-occ-del" desktop-interaction-v69.js
          grep -q "data-v69-forecast" desktop-interaction-v69.js
          grep -q "bonus-modal-stability-v67.js?v=67" sw.js
          grep -q "mobile-host-v70.js?v=70" sw.js
          ! grep -q "mobile-cashflow-v60.js?v=60" sw.js
          grep -q "mobile-interaction-kernel-v68.js?v=68" sw.js
          grep -q "desktop-interaction-v69.js?v=69" sw.js
          grep -q "household-treasury-v70-phase1" sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
