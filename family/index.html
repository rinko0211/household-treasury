<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://vqgofvnqmformckkkyur.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>わが家の生活費｜変動費メーター</title>
<link rel="icon" href="../icons/icon.svg"><link rel="stylesheet" href="./family.css?v=160">
</head><body>
<main class="wrap">
 <header><div class="brand"><span class="mark" aria-hidden="true">⌂</span><span>わが家の生活費</span></div><span class="tag">閲覧専用</span></header>
 <section class="hero" aria-labelledby="spentTitle">
  <p class="eyebrow" id="period">給与サイクルの変動費</p>
  <h1 id="spentTitle">今月使った金額</h1>
  <p class="spent" id="spent" aria-live="polite">—</p>
  <div id="budgetSection" hidden>
   <div class="remaining"><div><span>今月の予算</span><strong id="budget">—</strong></div><div><span id="remainLabel">あと使える金額</span><strong id="remaining">—</strong></div></div>
   <div class="progress" role="meter" aria-label="変動費の予算使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="budgetMeter"><div id="progressFill"></div></div>
   <p id="budgetRatio" class="progress-note"></p>
  </div>
  <p id="budgetEmpty" class="muted">予算はまだ設定されていません</p>
 </section>
 <section class="section" aria-labelledby="categoryTitle"><div class="section-head"><h2 id="categoryTitle">使いみち</h2><span>カテゴリ別</span></div><div id="categories" class="categories"><p class="muted">読み込み中…</p></div></section>
 <section class="note" id="caution" hidden><strong>まだ分類されていない支出があります</strong><p id="cautionText"></p></section>
 <footer><span id="updated">更新日時を確認中</span><button type="button" id="refresh">最新に更新 ↻</button></footer>
 <p id="status" role="status" aria-live="polite" class="status"></p>
 <p class="privacy">カード決済は購入日基準で計上。カード引落をもう一度足しません。給与・口座残高・投資情報は表示しません。</p>
</main>
<script src="./family.js?v=160" defer></script>
</body></html>
