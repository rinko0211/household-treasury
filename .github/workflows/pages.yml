name: Deploy Household Treasury

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            case "$(basename "$f")" in
              sync-v24.js|sync-v26.js)
                cp "$f" "/tmp/$(basename "$f" .js).mjs"
                node --check "/tmp/$(basename "$f" .js).mjs"
                ;;
              *)
                node --check "$f"
                ;;
            esac
          done
      - name: Check critical runtime loaders
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "semantic-model-v47.js" sync-state-sanitizer-v22.js
          grep -Fq "occurrence-card-bridge-v65.js" sync-state-sanitizer-v22.js
          grep -Fq "mufg-import-integrity-v65.js" sync-state-sanitizer-v22.js
          grep -Fq "audit-hardening-v65.js" sync-state-sanitizer-v22.js
          grep -Fq "revolving-card-v66.js" sync-state-sanitizer-v22.js
          grep -Fq "bonus-modal-stability-v67.js" sync-state-sanitizer-v22.js
          grep -Fq "mobile-host-v70.js" sync-state-sanitizer-v22.js
          grep -Fq "mobile-interaction-v70.js" sync-state-sanitizer-v22.js
          grep -Fq "desktop-interaction-v69.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./expense-scope-v34.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./review-center-v40.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./annual-reserve-v36.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./interaction-stability-v62.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./master-occurrence-overrides-v63.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./card-detail-stability-v64.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./mobile-cashflow-v60.js" sync-state-sanitizer-v22.js
          ! grep -Fq "injectClassic('./mobile-interaction-kernel-v68.js" sync-state-sanitizer-v22.js
          grep -Fq "masterOccurrenceOverrides" sync-v26.js
          grep -Fq "payment_model:'REVOLVING'" revolving-card-v66.js
          grep -Fq "CARD_REVOLVING_PAYMENT" revolving-card-v66.js
          grep -Fq "principal_unknown:true" revolving-card-v66.js
          grep -Fq "data-v69-event-del" desktop-interaction-v69.js
          grep -Fq "data-v69-occ-del" desktop-interaction-v69.js
          grep -Fq "data-v69-forecast" desktop-interaction-v69.js
      - name: Check v70 mobile single-owner phase 2
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "__householdConsolidatedUiV70 = true" sync-state-sanitizer-v22.js
          grep -Fq "renderFuturePlannerV37=()=>{}" future-planner-v37.js
          grep -Fq "renderCardForecastV49=()=>{}" card-forecast-v49.js
          grep -Fq "renderMobileCashflowV59=()=>{}" mobile-cashflow-v59.js
          grep -Fq "if(window.__householdConsolidatedUiV70)return" revolving-card-v66.js
          grep -Fq "__mobileKernelGeneratedV70" mobile-interaction-v70.js
          grep -Fq "data-v70-event-del" mobile-interaction-v70.js
          grep -Fq "data-v70-occ-del" mobile-interaction-v70.js
          grep -Fq "data-v70-forecast" mobile-interaction-v70.js
          grep -Fq "planCache" mobile-interaction-v70.js
          grep -Fq "mobile-host-v70.js?v=70" sw.js
          grep -Fq "mobile-interaction-v70.js?v=70" sw.js
          ! grep -Fq "mobile-cashflow-v60.js?v=60" sw.js
          ! grep -Fq "mobile-interaction-kernel-v68.js?v=68" sw.js
          grep -Fq "desktop-interaction-v69.js?v=69" sw.js
      - name: Check v72 mobile runtime gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "mobile-runtime-gate-v72.js?v=72" sync-state-sanitizer-v22.js
          grep -Fq "(min-width:821px)" sync-state-sanitizer-v22.js
          grep -Fq "__mobileRuntimeGateV72" mobile-runtime-gate-v72.js
          grep -Fq "suppressDocClick" mobile-runtime-gate-v72.js
          grep -Fq "desktopCashflowV69" mobile-runtime-gate-v72.js
          grep -Fq "mobile-runtime-gate-v72.js?v=72" sw.js
          grep -Fq "semantic-observer-guard-v71.js?v=71" sw.js
          grep -Fq "tab-router-v71.js?v=71" sw.js
      - name: Check v73 import integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "csv-parser-v73.js?v=73" sync-state-sanitizer-v22.js
          grep -Fq "mobile-import-v73.js?v=73" sync-state-sanitizer-v22.js
          grep -Fq "card-import-corrections-v73.js?v=73" sync-state-sanitizer-v22.js
          grep -Fq "mobileCsvPickerV73" mobile-import-v73.js
          grep -Fq "htmlFor='csvInput'" mobile-import-v73.js
          grep -Fq "CSV_PAYMENT_HEADER" card-import-corrections-v73.js
          grep -Fq "data-v73-purchase" card-import-corrections-v73.js
          grep -Fq "data-v73-settlement" card-import-corrections-v73.js
          grep -Fq "csv-parser-v73.js?v=73" sw.js
          grep -Fq "mobile-import-v73.js?v=73" sw.js
          grep -Fq "card-import-corrections-v73.js?v=73" sw.js
          node <<'NODE'
          const {parseCsvV73}=require('./csv-parser-v73.js');
          const rows=parseCsvV73('a,b,c\r\n1,"x,y",3\r\n2,"hello\r\nworld",4\r\n');
          if(rows.length!==3)throw new Error(`expected 3 rows, got ${rows.length}`);
          if(rows[1][1]!=='x,y')throw new Error('quoted comma parsing failed');
          if(rows[2][1]!=='hello\r\nworld')throw new Error('quoted newline parsing failed');
          NODE
      - name: Check v74 Rakuten e-NAVI semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "rakuten-enavi-v74.js?v=74" sync-state-sanitizer-v22.js
          grep -Fq "rakuten-enavi-v74.js?v=74" sw.js
          grep -Fq "household-treasury-v74-rakuten-enavi" sw.js
          node <<'NODE'
          const {parseCsvV73}=require('./csv-parser-v73.js');
          const {analyzeRakutenEnaviV74}=require('./rakuten-enavi-v74.js');
          const csv='利用日,利用店名・商品名,利用者,支払方法,利用金額,手数料/利息,支払総額,支払月,9月支払金額,当月請求額,10月繰越残高,10月以降請求額\r\n'+
            '2026/08/29,通常利用,本人,1回払い,22000,0,22000,9月,22000,22000,0,\r\n'+
            '2026/05/28,返済方法変更ＷＥＢ　MYPROTEIN,本人,"分割変更3回払い\r\n(3回目)",- ,334,11674,9月,3891,3891,0,\r\n'+
            ',購入金額：\\11340 / 分割変更金額：\\11340,,,,,,,,,,\r\n'+
            '2026/09/01,翌月利用,本人,1回払い,3451,0,3451,10月以降,,,,3451\r\n';
          const a=analyzeRakutenEnaviV74(csv,'enavi202609(3149)(1).csv',parseCsvV73);
          if(a.statementYm!=='2026-09')throw new Error(`statement month ${a.statementYm}`);
          if(a.currentTotal!==25891)throw new Error(`current total ${a.currentTotal}`);
          if(a.installments.length!==1)throw new Error(`installments ${a.installments.length}`);
          if(a.futurePurchases.length!==1||a.futurePurchases[0].billingMonth!=='2026-10')throw new Error('future month mapping failed');
          if(a.dueDate!=='2026-09-28')throw new Error(`due date ${a.dueDate}`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
