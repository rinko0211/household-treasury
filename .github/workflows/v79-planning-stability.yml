name: Check v79 Planning Stability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check v79 syntax and loaders
        shell: bash
        run: |
          set -euo pipefail
          node --check planning-model-v79.js
          node --check planning-ui-v79.js
          grep -Fq "planning-model-v79.js?v=115" sync-state-sanitizer-v22.js
          grep -Fq "planning-ui-v79.js?v=107" sync-state-sanitizer-v22.js
          grep -Fq "planning-model-v79.js?v=115" sw.js
          grep -Fq "planning-ui-v79.js?v=107" sw.js
          grep -Fq "household-treasury-v79-planning-stability" sw.js
      - name: Check stable single-path UI behavior
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "MutationObserver" planning-model-v79.js
          ! grep -Fq "MutationObserver" planning-ui-v79.js
          ! grep -Fq "setInterval" planning-model-v79.js
          ! grep -Fq "setInterval" planning-ui-v79.js
          grep -Fq "cashflowForecastChartV21" planning-ui-v79.js
          grep -Fq "grid.prepend(chart)" planning-ui-v79.js
          grep -Fq "forecastHorizon" planning-ui-v79.js
          grep -Fq "treasury:pagechange" planning-ui-v79.js
          grep -Fq "householdExpenseAnalyticsV106" planning-ui-v79.js
          grep -Fq "dashSpendV79" planning-ui-v79.js
      - name: Check salary and card baseline model
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "ensureSalaryRows" planning-model-v79.js
          grep -Fq "settings_salary_v79" planning-model-v79.js
          grep -Fq "monthlyBaselineAmount" planning-model-v79.js
          grep -Fq "forecastAmountForCard" planning-model-v79.js
          grep -Fq "D_CARD_STANDARD_EXACT_V91" planning-model-v79.js
          grep -Fq "card_cashflow_override" planning-model-v79.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const state={masters:{cards:[]}};
          const window={getTreasuryStateRaw:()=>state,getTreasuryState:()=>state};
          const sandbox={window,structuredClone,console,setTimeout:()=>0,clearTimeout:()=>{},generated:()=>[]};
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('planning-model-v79.js','utf8'),sandbox);
          const p=window.householdPlanningV79;
          const d={name:'dカード',paymentMode:'FULL',forecastMode:'BASELINE',monthlyBaselineAmount:70000};
          const r={name:'楽天カード',paymentMode:'FULL',forecastMode:'BASELINE',monthlyBaselineAmount:70000};
          if(p.forecastAmountForCard(d,95000)!==70000)throw new Error('d-card standard amount must be exact');
          if(p.forecastAmountForCard(r,95000)!==95000)throw new Error('non d-card floor behavior changed unexpectedly');
          state.cashTransactions=[{id:'salary-actual',date:'2026-10-18',amount:543210,cashflow_type:'INCOME_SALARY',description_raw:'給与'}];
          const actual=p.actualSalaryForMonth(state,'2026-10');
          if(!actual||Number(actual.amount)!==543210)throw new Error('actual salary not authoritative: '+JSON.stringify(actual));
          NODE
      - name: Check planned income reconciles to differing bank actual
        shell: bash
        run: |
          set -euo pipefail
          node --check cashflow-reconciliation-v102.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const state={settings:{cash:1000000},cashTransactions:[{id:'salary-actual',date:'2026-09-18',amount:543210,cashflow_type:'INCOME_SALARY',description_raw:'給与'}],masters:{},events:[],cardSettlements:[]};
          const ctx={console,Date,Intl,Map,Set,Number,String,Math,structuredClone,setTimeout:()=>0,clearTimeout:()=>{},localStorage:{getItem:()=>null}};
          ctx.window=ctx;ctx.document={addEventListener:()=>{},querySelector:()=>null,getElementById:()=>null};ctx.window.addEventListener=()=>{};ctx.getTreasuryStateRaw=()=>state;ctx.getTreasuryState=()=>state;
          vm.createContext(ctx);vm.runInContext(fs.readFileSync('cashflow-reconciliation-v102.js','utf8'),ctx);
          const model={history:[{key:'salary:2026-09',date:'2026-09-18',name:'給与',amount:500000,type:'SALARY',source:'settings_salary'}]};
          const r=ctx.householdCashflowReconciliationV102.reconcileHistoryStatuses(state,model,{date:'2026-09-29',balance:1000000},'2026-09-29');
          const row=model.history[0];
          if(r.matched!==1||row.status!=='MATCHED_ACTUAL'||Number(row.actual_amount)!==543210)throw new Error('differing salary actual not reconciled: '+JSON.stringify({r,row}));
          console.log('differing actual income reconciliation PASS',JSON.stringify(row));
          NODE
      - name: Check dashboard and annual transparency
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "次の給与まで最低" planning-ui-v79.js
          grep -Fq "2か月最低" planning-ui-v79.js
          grep -Fq "3か月最低" planning-ui-v79.js
          grep -Fq "6か月最低" planning-ui-v79.js
          grep -Fq "その場で内訳を見る" planning-ui-v79.js
          grep -Fq "年払い・ボーナス使途" planning-ui-v79.js
          grep -Fq "月別積立内訳" planning-ui-v79.js
          grep -Fq "月別収支（年払い積立後）" planning-ui-v79.js
          grep -Fq "data-v79-annual-calc" planning-ui-v79.js
          grep -Fq "shortage-bonusTotal" planning-model-v79.js
